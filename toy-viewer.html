<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b09" />
  <title>Галерея призов — Хватайка-67</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b09;
      --panel: rgba(10, 19, 16, 0.93);
      --panel-soft: rgba(18, 31, 26, 0.76);
      --gold: #ffc247;
      --red: #ff3045;
      --cyan: #38f5ff;
      --text: #f0e8d3;
      --muted: #93a79f;
      --line: rgba(255, 194, 71, 0.25);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
    body {
      color: var(--text);
      font-family: Consolas, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 66% 42%, rgba(47, 82, 69, 0.23), transparent 33%),
        linear-gradient(145deg, #040705 0%, #0b1210 55%, #050706 100%);
    }

    button, input, select, a { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    #app {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      grid-template-rows: 76px minmax(0, 1fr);
      width: 100%;
      height: 100%;
    }

    header {
      grid-column: 1 / -1;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 10, 8, 0.86);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.24);
    }

    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brandMark {
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 194, 71, 0.58);
      border-radius: 8px;
      color: var(--gold);
      background: linear-gradient(145deg, rgba(127, 29, 29, 0.42), rgba(12, 23, 19, 0.88));
      box-shadow: inset 0 0 0 2px rgba(255, 48, 69, 0.1), 0 0 24px rgba(255, 48, 69, 0.12);
      font-weight: 900;
      font-size: 19px;
    }
    .brandText { min-width: 0; }
    .brandText strong { display: block; overflow: hidden; color: #ffe7a6; letter-spacing: 2px; white-space: nowrap; text-overflow: ellipsis; }
    .brandText span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; letter-spacing: 1.8px; }

    .topControls { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .control, .backLink {
      height: 38px;
      padding: 0 13px;
      border: 1px solid rgba(255, 194, 71, 0.35);
      border-radius: 5px;
      color: #f5dfaa;
      background: rgba(25, 39, 33, 0.72);
      cursor: pointer;
      text-decoration: none;
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .control:hover, .backLink:hover { border-color: var(--gold); background: rgba(127, 29, 29, 0.28); box-shadow: 0 0 15px rgba(255, 48, 69, 0.17); }
    .control:active, .backLink:active { transform: translateY(1px); }
    .control[aria-pressed="true"] { border-color: var(--cyan); color: #bdf8ff; background: rgba(13, 75, 78, 0.32); }
    .control:focus-visible, .backLink:focus-visible, .toyButton:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    aside {
      position: relative;
      z-index: 12;
      min-height: 0;
      padding: 16px 13px 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(12px);
    }
    .catalogHead { padding: 0 5px 12px; }
    .catalogHead strong { color: var(--gold); font-size: 12px; letter-spacing: 2px; }
    .catalogHead span { float: right; color: var(--muted); font-size: 11px; }
    #toySearch {
      width: 100%;
      height: 38px;
      margin: 0 0 12px;
      padding: 0 11px;
      border: 1px solid rgba(147, 167, 159, 0.24);
      border-radius: 5px;
      color: var(--text);
      background: rgba(2, 6, 5, 0.5);
    }
    #toySearch::placeholder { color: #6d8279; }
    #toyList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: calc(100% - 79px);
      overflow: auto;
      padding: 2px 4px 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 194, 71, 0.38) transparent;
    }
    .toyButton {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 44px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #cbd8d2;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: all .14s ease;
    }
    .toyButton:hover { color: #fff0c9; border-color: rgba(255, 194, 71, 0.2); background: rgba(255, 194, 71, 0.06); }
    .toyButton[aria-selected="true"] {
      color: #fff0c9;
      border-color: rgba(255, 194, 71, 0.5);
      background: linear-gradient(90deg, rgba(127, 29, 29, 0.34), rgba(255, 194, 71, 0.08));
      box-shadow: inset 3px 0 var(--red);
    }
    .toyIndex { color: #71847c; font-size: 10px; }
    .toyButton[aria-selected="true"] .toyIndex { color: var(--gold); }
    .toyName { overflow: hidden; font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
    .toyArrow { color: transparent; }
    .toyButton[aria-selected="true"] .toyArrow { color: var(--cyan); }

    main { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #viewerMount { position: absolute; inset: 0; touch-action: none; }
    #viewerMount canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    #viewerMount canvas:active { cursor: grabbing; }

    .viewerCaption {
      position: absolute;
      z-index: 8;
      top: 20px;
      left: 24px;
      pointer-events: none;
    }
    #toyTitle { margin: 0; color: #fff1c8; font: 900 clamp(24px, 4vw, 46px)/1 "Arial Narrow", "Segoe UI", sans-serif; letter-spacing: 1px; text-shadow: 0 6px 30px #000; }
    #toyMeta { margin-top: 8px; color: var(--cyan); font-size: 11px; letter-spacing: 2px; }

    .hint {
      position: absolute;
      z-index: 8;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 28px);
      padding: 8px 13px;
      border: 1px solid rgba(56, 245, 255, 0.2);
      border-radius: 999px;
      color: #a9c8c5;
      background: rgba(4, 10, 8, 0.7);
      backdrop-filter: blur(8px);
      font-size: 11px;
      letter-spacing: .7px;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity .3s ease;
    }
    .hint.used { opacity: .45; }

    #mobileSelectWrap { display: none; }
    .cornerReadout {
      position: absolute;
      z-index: 8;
      right: 18px;
      bottom: 18px;
      color: rgba(147, 167, 159, 0.58);
      font-size: 9px;
      letter-spacing: 1.5px;
      pointer-events: none;
    }

    @media (max-width: 860px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 68px minmax(0, 1fr); }
      header { padding: 9px 10px; gap: 8px; }
      .brandMark { width: 40px; height: 40px; }
      .brandText span { display: none; }
      .brandText strong { font-size: 12px; letter-spacing: 1px; }
      aside { display: none; }
      main { grid-column: 1; }
      .topControls { gap: 5px; }
      .control, .backLink { width: 38px; padding: 0; font-size: 0; }
      .control::first-letter, .backLink::first-letter { font-size: 15px; }
      #mobileSelectWrap {
        position: absolute;
        z-index: 10;
        top: 16px;
        right: 12px;
        display: block;
      }
      #mobileToySelect {
        max-width: 46vw;
        height: 38px;
        padding: 0 28px 0 10px;
        border: 1px solid rgba(255, 194, 71, 0.4);
        border-radius: 5px;
        color: #ffe9b4;
        background: rgba(7, 14, 11, 0.9);
      }
      .viewerCaption { top: 18px; left: 14px; max-width: 46vw; }
      #toyTitle { font-size: clamp(21px, 7vw, 34px); }
      #toyMeta { font-size: 9px; letter-spacing: 1px; }
      .hint { bottom: 14px; overflow: hidden; font-size: 9px; text-overflow: ellipsis; }
      .cornerReadout { display: none; }
    }

    @media (max-width: 520px) {
      .brandText { display: none; }
      .backLink { display: none; }
      .viewerCaption { top: 68px; max-width: 80vw; }
      #mobileSelectWrap { right: 10px; }
      #mobileToySelect { max-width: 55vw; }
    }
  </style>
  <script type="module" crossorigin src="./assets/toys-7vg6Yx8b.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-Bi-D_2cA.js">
  <link rel="modulepreload" crossorigin href="./assets/three-core-CM1SPQVe.js">
  <link rel="modulepreload" crossorigin href="./assets/three-core-D97vG1mD.js">
  <link rel="modulepreload" crossorigin href="./assets/three-core-B3heRoS7.js">
  <link rel="modulepreload" crossorigin href="./assets/three-core-BY5SkiPz.js">
  <link rel="modulepreload" crossorigin href="./assets/three-addons-CgcgmdzC.js">
  <link rel="modulepreload" crossorigin href="./assets/toys-CwyACj1P.js">
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <div class="brandMark">67</div>
        <div class="brandText">
          <strong>АРХИВ ПРИЗОВ</strong>
          <span>ХВАТАЙКА-67 · ИНСПЕКЦИОННЫЙ СТЕНД</span>
        </div>
      </div>
      <div class="topControls" aria-label="Управление просмотром">
        <button class="control" id="prevToy" title="Предыдущая игрушка (←)">← ПРЕД</button>
        <button class="control" id="nextToy" title="Следующая игрушка (→)">→ СЛЕД</button>
        <button class="control" id="autoRotate" aria-pressed="true" title="Автоповорот (Пробел)">↻ АВТО</button>
        <button class="control" id="resetView" title="Сбросить ракурс (R)">⌂ СБРОС</button>
        <a class="backLink" href="./" title="Вернуться к автомату">▣ АВТОМАТ</a>
      </div>
    </header>

    <aside aria-label="Каталог игрушек">
      <div class="catalogHead"><strong>КАТАЛОГ</strong><span id="toyCount"></span></div>
      <input id="toySearch" type="search" placeholder="Найти игрушку…" autocomplete="off" />
      <div id="toyList" role="listbox" aria-label="Выберите игрушку"></div>
    </aside>

    <main>
      <div id="viewerMount" aria-label="Интерактивная трёхмерная модель игрушки"></div>
      <div class="viewerCaption">
        <h1 id="toyTitle">Игрушка</h1>
        <div id="toyMeta">ПРИЗ 01 / 18</div>
      </div>
      <div id="mobileSelectWrap">
        <select id="mobileToySelect" aria-label="Выберите игрушку"></select>
      </div>
      <div class="hint" id="viewerHint">МЫШЬ / ПАЛЕЦ — КРУТИТЬ · КОЛЕСО / ЩИПОК — МАСШТАБ</div>
      <div class="cornerReadout">THREE.JS · PROCEDURAL PLUSH</div>
    </main>
  </div>

</body>
</html>
